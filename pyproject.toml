[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneme-microevolution"
version = "0.1.0"
description = "A provenance-first longitudinal vowel measurement pilot"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.18",
  "praat-parselmouth>=0.4.3",
  "streamlit>=1.35",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
microevolution = "microevolution.cli:main"

[tool.setuptools.packages.find]
include = ["microevolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

